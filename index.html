<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#635bff" />
    <title>Mon assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="brand">
          <span class="brand-mark">✦</span>
          <span>Mon assistant</span>
        </div>

        <nav class="nav" id="sidebar-nav"></nav>

        <button class="user-card" type="button" data-page="settings">
          <span class="avatar">L</span>
          <span>
            <strong>Mon espace</strong>
            <small>Paramètres</small>
          </span>
          <span aria-hidden="true">›</span>
        </button>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="menu-button" id="menu-button" type="button" aria-label="Ouvrir la navigation" aria-expanded="false">☰</button>
          <div class="mobile-brand">✦ <span>Mon assistant</span></div>
          <div class="topbar-actions">
            <button class="icon-button" type="button" aria-label="Notifications">🔔</button>
            <button class="avatar mobile-avatar" type="button">L</button>
          </div>
        </header>

        <div id="app" class="page-container" tabindex="-1"></div>
      </main>

      <button class="overlay" id="overlay" aria-label="Fermer le menu"></button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
